; Por cima do php.ini-production.

; Não anunciar a versão do PHP em cada resposta.
expose_php = Off

; O formulário aceita extrato de até 2 MB. A folga aqui faz o arquivo grande chegar ao
; Laravel, que responde com a mensagem de validação, em vez de o PHP descartá-lo calado.
upload_max_filesize = 4M
post_max_size = 8M

; O código não muda dentro da imagem: o opcache não precisa conferir se o arquivo mudou.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
